[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-estimator"
version = "0.1.0"
description = "Estimate LLM API costs across providers from token counts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llm-cost = "cost_estimator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
